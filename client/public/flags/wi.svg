  <path d="M61,32 Q64,36 71,37 Q66,35 61,32" fill="#2E8B57"/>
  
  <!-- Cricket Stumps and Bails -->
  <!-- Three Stumps -->
  <rect x="52" y="45" width="1.2" height="9" fill="#FFFFFF"/>
  <rect x="55" y="45" width="1.2" height="9" fill="#FFFFFF"/>
  <rect x="58" y="45" width="1.2" height="9" fill="#FFFFFF"/>
  <!-- Bails -->
